<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myProduct-Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  <!-- กล่องใหญ่ -->
  <div class="product-card">
    <!-- ส่วนรูปภาพและป้ายแท็กต่างๆ -->
    <div class="product-preview">
      <!-- ป้ายกับปุ่มหัวใจ -->
      <div class="preview-header">
        <div class="badge">
          <span>Best Seller</span>
        </div>
        <button class="btn-favorite"><i class="fa fa-heart" aria-hidden="true"></i>
        </button>
      </div>
      <!-- รูป -->
      <img
        src="https://static.nike.com/a/images/t_web_pdp_936_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/3332c917-d191-4a65-a1af-5a753797ba0a/AIR+FORCE+1+%2707+LV8+SPORT.png"
        alt="nike-shoes">
      <!-- จุดบอกสไลด์ 3 จุด -->
      <div class="carousel-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <!-- ส่วนเนื้อหา -->
    <div class="product-content">
      <span class="product-brnad">Nike</span>
      <h2 class="product-title">Nike Air Force 1 '07 LV8
      </h2>
      <p class="product-price">฿4,700</p>
    </div>
    <!-- ส่วนปุ่ม -->
    <div class="product-action">
      <button class="buy-btn">Buy Now</button>
    </div>
  </div>
</body>

</html>
