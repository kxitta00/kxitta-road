<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductCard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  <div class="product-card">
    <div class="preview-header">
      <span class="badge">39% OFF</span>
      <img src="./shoes00-removebg-preview.png" alt="Nike Air MX Super 2500 - Red">
    </div>

    <div class="product-content">
      <h2 class="product-title">Nike Air MX Super 2500 - Red</h2>
      <div class="product-price-and-review">
        <div class="tag-price">
          <span class="sell-price">$499</span>
          <span class="price">$699</span>
        </div>
        <div class="review-tag">
          <div class="star">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
          </div>
          <div class="rate">5.0</div>
        </div>
      </div>
    </div>
    <button class="btn-buy"><i class="fa-solid fa-basket-shopping"></i>Add to cart</button>
  </div>
</body>

</html>
