<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form-event</title>
  <script src="app.js" defer></script>
</head>

<body>
  <form id="user-form">
    <input type="text" id="username-input" placeholder="พิมพ์ชื่อผู้ใช้...">
    <select id="role-select">
      <option>Member</option>
      <option>Admin</option>
      <option>Moderator</option>
    </select>
    <button type="submit">บันทึกข้อมูล</button>
  </form>
  <p id="preview-text">บทบาทที่เลือก: Member</p>
  <p id="result-text">ผลลัพธ์การส่งฟอร์ม</p>
</body>

</html>
