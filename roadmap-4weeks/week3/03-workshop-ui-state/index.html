<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop_Ui-State</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <button id="btn-success">Success Test(ID1 )</button>
    <button id="btn-error">Error Test(ID 999999)</button>

    <div id="loading" class="hidden">Loading...</div>
    <div id="error" class="hidden">
      <p id="error-msg"></p>
    </div>

    <div id="success" class="hidden">
      <img id="user-img" alt="UserImage">
      <h2 id="user-name"></h2>
      <p id="user-email"></p>
    </div>


  </div>


  <script src="app.js" defer></script>
</body>

</html>
